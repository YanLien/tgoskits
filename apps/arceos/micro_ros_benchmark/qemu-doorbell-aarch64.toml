args = [
    "-machine",
    "virt,gic-version=3",
    "-m",
    "256M",
    "-cpu",
    "cortex-a72",
    "-smp",
    "1",
    "-chardev",
    "socket,path=/tmp/micro-ros-ivshmem.sock,id=ivshmem",
    "-device",
    "ivshmem-doorbell,vectors=1,chardev=ivshmem",
    "-display",
    "none",
    "-serial",
    "mon:stdio",
]
uefi = false
to_bin = true
success_regex = ["MICRO_ROS_BENCHMARK_OK platform=arceos tests=3 samples=1000"]
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "MICRO_ROS_BENCHMARK_FAILED", "rcl_ret="]
timeout = 60
