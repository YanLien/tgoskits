args = [
    "-machine",
    "virt,gic-version=3",
    "-m",
    "256M",
    "-cpu",
    "cortex-a72",
    "-smp",
    "1",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
    "-display",
    "none",
    "-serial",
    "mon:stdio",
]
uefi = false
to_bin = true
success_regex = ["MICRO_ROS_FEATURES_OK executor=1 guard_condition=1 qos_best_effort=1 subscriber=1 service_server=1 service_client=1 action_server=1 action_client=1 parameter=1 lifecycle=1 time_sync=1"]
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "agent ping failed", "rcl_ret="]
timeout = 120
